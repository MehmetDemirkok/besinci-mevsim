<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" preserveAspectRatio="none">
  <defs>
    <linearGradient id="pillarL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05070a" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0a1216" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#071014" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pillarR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#05070a" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0a1216" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#071014" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070a" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#071014" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#071014" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.15" y1="0" x2="0.88" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="62%" stop-color="#18BBD0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="68%">
      <stop offset="40%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#vignette)"/>
  <rect width="1600" height="900" fill="url(#glass)"/>
  <rect width="1600" height="150" fill="url(#roof)"/>
  <path d="M0 0 L300 0 L175 900 L0 900 Z" fill="url(#pillarL)"/>
  <path d="M1600 0 L1300 0 L1425 900 L1600 900 Z" fill="url(#pillarR)"/>
  <!-- rearview mirror -->
  <g transform="translate(800, 38)">
    <rect x="-78" y="0" width="156" height="46" rx="8" fill="#0b151a" stroke="#18BBD0" stroke-opacity="0.18"/>
    <rect x="-70" y="8" width="140" height="30" rx="4" fill="#101a1f"/>
    <rect x="-4" y="-10" width="8" height="14" rx="2" fill="#152228"/>
  </g>
</svg>
